<script>
/* 自包含 Markdown 渲染器（标题/表格/加粗/引用/列表/代码块/分隔线），无 CDN 依赖 */
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function inline(s){
  s = esc(s);
  s = s.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
  s = s.replace(/\*(.+?)\*/g,"<em>$1</em>");
  s = s.replace(/`([^`]+)`/g,"<code>$1</code>");
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>');
  return s;
}
function render(md){
  const lines = md.split("\n");
  let html = [], i = 0, inUl = false;
  const closeUl = ()=>{ if(inUl){ html.push("</ul>"); inUl=false; } };
  while(i < lines.length){
    let ln = lines[i].replace(/\s+$/,"");
    if(ln.startsWith("```")){
      closeUl(); let buf=[]; i++;
      while(i<lines.length && !lines[i].startsWith("```")){ buf.push(lines[i]); i++; }
      html.push("<pre><code>"+esc(buf.join("\n"))+"</code></pre>"); i++; continue;
    }
    if(/^\s*\|/.test(ln)){
      closeUl(); let rows=[];
      while(i<lines.length && /^\s*\|/.test(lines[i])){
        const cells = lines[i].trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
        if(!cells.every(c=>/^:?-{2,}:?$/.test(c))) rows.push(cells);
        i++;
      }
      if(rows.length){
        let t="<table><thead><tr>"+rows[0].map(c=>"<th>"+inline(c)+"</th>").join("")+"</tr></thead><tbody>";
        for(let r=1;r<rows.length;r++) t+="<tr>"+rows[r].map(c=>"<td>"+inline(c)+"</td>").join("")+"</tr>";
        html.push(t+"</tbody></table>");
      }
      continue;
    }
    const h = ln.match(/^(#{1,4})\s+(.*)/);
    if(h){ closeUl(); const lv=Math.min(h[1].length+ (h[1].length===1?0:0),4); html.push("<h"+lv+">"+inline(h[2])+"</h"+lv+">"); i++; continue; }
    if(/^(-{3,}|\*{3,})\s*$/.test(ln)){ closeUl(); html.push("<hr>"); i++; continue; }
    if(ln.startsWith(">")){ closeUl(); let buf=[];
      while(i<lines.length && lines[i].startsWith(">")){ buf.push(lines[i].replace(/^>\s?/,"")); i++; }
      html.push("<blockquote>"+buf.map(x=>inline(x)).join("<br>")+"</blockquote>"); continue; }
    if(/^\s*[-*]\s+/.test(ln)){
      if(!inUl){ html.push("<ul>"); inUl=true; }
      html.push("<li>"+inline(ln.replace(/^\s*[-*]\s+/,""))+"</li>"); i++; continue;
    }
    if(ln.trim()===""){ closeUl(); i++; continue; }
    closeUl(); html.push("<p>"+inline(ln)+"</p>"); i++;
  }
  closeUl();
  return html.join("\n");
}
fetch("thesis/paper.md").then(r=>{ if(!r.ok) throw 0; return r.text(); })
  .then(md=>{ document.getElementById("content").className=""; document.getElementById("content").innerHTML = render(md); window.__md=md; })
  .catch(()=>{ document.getElementById("content").innerHTML =
    "<p>正文加载失败。请直接访问原始文件：<a href='thesis/paper.md'>thesis/paper.md</a> ｜ <a href='results/summary.md'>results/summary.md</a></p>"; });
</script>
